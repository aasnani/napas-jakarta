name: napas-jakarta
prefect-version: ">=3.0.0"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: daily-official-refresh
    description: Validate, publish, and index the configured Jakarta air-quality source.
    entrypoint: ingestion/flow.py:prefect_ingestion
    parameters:
      data_dir: data
    schedules:
      - cron: "0 * * * *"
        timezone: Asia/Jakarta
        active: true
    work_pool:
      name: napas-jakarta-processes
      work_queue_name: default
      job_variables:
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
